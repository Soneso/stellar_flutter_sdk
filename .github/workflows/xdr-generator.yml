name: XDR Generator

on:
  push:
    branches: [master]
    paths:
      - 'tools/xdr-generator/**'
      - 'tools/sep-51-corpus/**'
      - 'xdr/*.x'
      - 'lib/src/xdr/**'
      - 'test/unit/xdr/generated/**'
      - 'test/unit/xdr/json_generated/**'
      - 'test/unit/sep/sep51_corpus_data.dart'
      - 'Makefile'
  pull_request:
    branches: [master]
    paths:
      - 'tools/xdr-generator/**'
      - 'tools/sep-51-corpus/**'
      - 'xdr/*.x'
      - 'lib/src/xdr/**'
      - 'test/unit/xdr/generated/**'
      - 'test/unit/xdr/json_generated/**'
      - 'test/unit/sep/sep51_corpus_data.dart'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: xdr-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Ruby gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/xdr-generator/vendor/bundle
          key: gems-${{ hashFiles('tools/xdr-generator/Gemfile.lock') }}

      - name: Run generator snapshot tests
        run: make xdr-generator-test

  generated-files-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Cache Ruby gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/xdr-generator/vendor/bundle
          key: gems-${{ hashFiles('tools/xdr-generator/Gemfile.lock') }}

      # Every generator runs before anything reads its output: a check run against a
      # half-written tree reports a shape that is not there.
      - name: Regenerate XDR files
        run: make xdr-generate

      - name: Regenerate the emitted XDR tests
        run: make xdr-generate-tests

      - name: Regenerate the emitted SEP-0051 tests and corpus data
        run: make sep51-generate-tests

      - name: Check for uncommitted changes
        run: |
          # Only paths a generator writes. Both emission targets format what they emit, so
          # the committed tree is the formatted emission and the verdict below turns on the
          # emission alone. The repository is not `dart format` clean outside these paths,
          # so widening the check would report pre-existing formatting as generator drift.
          GENERATED_PATHS=(
            lib/src/xdr/
            test/unit/xdr/generated/
            test/unit/xdr/json_generated/
            test/unit/sep/sep51_corpus_data.dart
          )

          if ! git diff --quiet -- "${GENERATED_PATHS[@]}" || \
             [ -n "$(git ls-files --others --exclude-standard -- "${GENERATED_PATHS[@]}")" ]; then
            echo "::error::Generated files are out of date."
            echo "Run 'make xdr-update', 'make xdr-generate-tests' and 'make sep51-generate-tests', then commit the results."
            echo ""
            echo "Modified files:"
            git diff --stat -- "${GENERATED_PATHS[@]}"
            echo ""
            echo "Untracked files:"
            git ls-files --others --exclude-standard -- "${GENERATED_PATHS[@]}"
            exit 1
          fi
